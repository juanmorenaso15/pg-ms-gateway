spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5500"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5500"
              - "https://*.front-end-pulsegym.pages.dev"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-User-Id
              - X-User-Rol
              - X-User-Email
              - X-User-Name
              - Accept
            exposedHeaders:
              - X-User-Id
              - X-User-Rol
              - X-User-Email
            allowCredentials: true
            maxAge: 3600
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
